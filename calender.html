<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Calendar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .calendar {
            table-layout: fixed;
            width: 100%;
        }

        .calendar th,
        .calendar td {
            text-align: center;
            vertical-align: middle;
            height: 80px;
            cursor: pointer;
            color: #004684;
        }

        .calendar td.event-day {
            background-color: #004684;
            color: white;
            position: relative;
        }

        .calendar td.event-day:hover {
            background-color: #084298;
        }

        .calendar td.event-day .event-label {
            font-size: 12px;
            color: white;
            position: absolute;
            top: 5px;
            left: 50%;
            transform: translateX(-50%);
        }

        .calendar td.disabled {
            color: #adb5bd;
        }

        .event-details {
            display: none;
            border-radius: 6px;
            background-color: #004684;
            padding-inline: 32px;
            padding-top: 29px;
            padding-bottom: 65px;
        }
    </style>
</head>

<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-8">
                <div class="d-flex justify-content-between align-items-center">
                    <button class="prev-month border-0 bg-white" id="prev-month">
                        <i class="bi bi-chevron-left" style="color:#004684 ;"></i>
                    </button>
                    <p id="month-name" class="month-name fw-bold" style="color: #004684;font-size: 25px;line-height: 32px;">October</p>
                    <button class="prev-month border-0 bg-white" id="next-month">
                        <i class="bi bi-chevron-right" style="color:#004684 ;"></i>
                    </button>
                </div>
                <table class="calendar table table-bordered mt-3">
                    <thead>
                        <tr>
                            <th>Su</th>
                            <th>Mo</th>
                            <th>Tu</th>
                            <th>We</th>
                            <th>Th</th>
                            <th>Fr</th>
                            <th>Sa</th>
                        </tr>
                    </thead>
                    <tbody id="calendar-body">
                        <!-- Calendar days will be generated here by JavaScript -->
                    </tbody>
                </table>
            </div>
            <div class="col-md-4 mt-md-5 pt-md-5 ">
                <div id="event-details" class="event-details position-relative" >
                    <h5 id="event-title" class="event-title text-white fw-bold"
                        style="font-size: 22px;line-height: 30px;">Euregio Council meeting November 2024</h5>
                    <p class="mt-3"><i class="bi bi-calendar-week text-white"></i> <span
                            class="event-date text-white ms-2">17.12.24</span></p>
                    <p class="text-white mb-1"><strong>Description:</strong></p>
                    <p class="event-location text-white">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do
                        eiusmod tempor incididunt ut labore et dolore magna aliqua.</p>
                    <div class="d-flex gap-2 align-items-center" style="cursor: pointer;">
                        <div class="bg-white" style="width: 9px;height: 23px;"></div>
                        <p class="m-0 fw-semibold text-white">Read More</p>
                        <img src="./assets/right-arrow-white.svg" alt="right-arrow">
                    </div>
                    <img src="./assets/Polygon.svg" alt="Polygon" style="position: absolute;top:5px;left: -10px;">
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        const events = {
            '2025-01-17': {
                title: 'Lorem Ipsum is simply dummy',
                description: 'Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.'
            }

        };

        $(document).ready(function () {
            const today = new Date();
            let currentMonth = today.getMonth();
            let currentYear = today.getFullYear();

            function renderCalendar(month, year) {
                const firstDay = new Date(year, month).getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const daysInPrevMonth = new Date(year, month, 0).getDate();
                const calendarBody = $('#calendar-body');
                calendarBody.empty();

                let date = 1;
                let nextMonthDate = 1;
                for (let i = 0; i < 6; i++) {
                    const row = $('<tr></tr>');
                    for (let j = 0; j < 7; j++) {
                        const cell = $('<td class="fw-bold"></td>');

                        if (i === 0 && j < firstDay) {
                            const prevDate = daysInPrevMonth - firstDay + j + 1;
                            cell.text(prevDate).addClass('disabled');
                        } else if (date > daysInMonth) {
                            cell.text(nextMonthDate++).addClass('disabled');
                        } else {
                            const formattedDate = `${year}-${String(month + 1).padStart(2, '0')}-${String(date).padStart(2, '0')}`;
                            cell.text(date);

                            if (events[formattedDate]) {
                                cell.addClass('event-day');
                                cell.append('<div class="event-label">Event Day</div>');
                                cell.click(() => showEventDetails(formattedDate));
                            }

                            date++;
                        }

                        row.append(cell);
                    }
                    calendarBody.append(row);
                }

                $('#month-name').text(new Date(year, month).toLocaleString('default', { month: 'long' }));
            }

            function showEventDetails(date) {
                const event = events[date];
                if (event) {
                    $('.event-title').text(event.title);
                    $('.event-date').text(date);
                    $('.event-description').text(event.description);
                    $('.event-details').fadeIn();
                }
            }

            $('.prev-month').click(() => {
                currentMonth--;
                if (currentMonth < 0) {
                    currentMonth = 11;
                    currentYear--;
                }
                renderCalendar(currentMonth, currentYear);
            });

            $('.next-month').click(() => {
                currentMonth++;
                if (currentMonth > 11) {
                    currentMonth = 0;
                    currentYear++;
                }
                renderCalendar(currentMonth, currentYear);
            });

            renderCalendar(currentMonth, currentYear);
        });
    </script>
</body>

</html>
