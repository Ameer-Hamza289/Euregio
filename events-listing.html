<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Events Listing</title>
  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <style>
    .event-card {
      border: 1px solid #ddd;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .event-card img {
      height: 200px;
      width: 100%;
      object-fit: cover;
    }

    .event-card .card-body {
      padding: 16px;
    }

    .event-card .card-date {
      font-size: 14px;
      color: #888;
      margin-bottom: 10px;
    }

    .pagination {
      justify-content: center;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container mt-5">
    <div id="events-container" class="row g-4">
      <!-- Dynamic Event Cards -->
    </div>

    <!-- Pagination -->
    <nav>
      <ul id="pagination" class="pagination"></ul>
    </nav>
  </div>

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Mock Data for Events
    const events = Array.from({ length: 31 }, (_, i) => ({
      date: "25.11.2024",
      title: `Event Title ${i + 1}`,
      description: "Lorem Ipsum has been the industry's standard dummy text.",
      image: "https://via.placeholder.com/300x200",
    }));

    const eventsPerPage = 6;
    let currentPage = 1;

    // Function to render events
    function renderEvents(page) {
      const startIndex = (page - 1) * eventsPerPage;
      const endIndex = startIndex + eventsPerPage;
      const eventsToShow = events.slice(startIndex, endIndex);

      const container = $("#events-container");
      container.empty(); // Clear previous events

      eventsToShow.forEach((event) => {
        container.append(`
          <div class="col-md-6 col-12">
                <div style="border-radius: 6px;" class="overflow-hidden d-flex">
                    <div style="width: 217px;height: 100%;">
                        <img src="./assets/news1.svg" alt="project-1-img">
                    </div>
                    <div style="background-color: #F6F6F6;padding-top: 21px;padding-inline: 31px;padding-bottom: 38px;">
                        <div class="d-flex gap-2">
                            <i class="bi bi-calendar2-week" style="color: #6F6F6F;"></i>
                            <p class="fw-medium" style="line-height: 28px;color: #6F6F6F;">25.11.2024</p>
                        </div>
                        <p class="fw-bold" style="font-size: 18px;line-height: 28px;color: #004684;">Lorem Ipsum is
                            simply dummy</p>
                        <p class="fw-medium" style="line-height: 28px;">Lorem Ipsum has been the industry's standard
                            dummy text.</p>
                        <div class="d-flex gap-2 align-items-center" style="cursor: pointer;">
                            <div style="width: 9px;height: 23px;background-color: #004684;"></div>
                            <p class="m-0 fw-semibold" style="color: #004684;">Read More</p>
                            <img src="./assets/right-arrow.svg" alt="right-arrow">
                        </div>
                    </div>
                </div>
            </div>
        `);
      });
    }

    // Function to render pagination
    function renderPagination() {
      const totalPages = Math.ceil(events.length / eventsPerPage);
      const pagination = $("#pagination");
      pagination.empty(); // Clear previous pagination

      // Previous Button
      pagination.append(`
        <li class="page-item ${currentPage === 1 ? "disabled" : ""}">
          <a class="page-link" href="#" data-page="${currentPage - 1}">‹</a>
        </li>
      `);

      // Page Numbers
      for (let i = 1; i <= totalPages; i++) {
        pagination.append(`
          <li class="page-item ${i === currentPage ? "active" : ""}">
            <a class="page-link" href="#" data-page="${i}">${i}</a>
          </li>
        `);
      }

      // Next Button
      pagination.append(`
        <li class="page-item ${currentPage === totalPages ? "disabled" : ""}">
          <a class="page-link" href="#" data-page="${currentPage + 1}">›</a>
        </li>
      `);
    }

    // Event Listener for Pagination
    $(document).on("click", ".page-link", function (e) {
      e.preventDefault();
      const page = parseInt($(this).data("page"));
      if (!isNaN(page) && page > 0 && page <= Math.ceil(events.length / eventsPerPage)) {
        currentPage = page;
        renderEvents(currentPage);
        renderPagination();
      }
    });

    // Initial Render
    $(document).ready(() => {
      renderEvents(currentPage);
      renderPagination();
    });
  </script>
</body>
</html>
